<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 250" width="100%" height="250">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050507" />
      <stop offset="35%" stop-color="#0c0507" />
      <stop offset="70%" stop-color="#140608" />
      <stop offset="100%" stop-color="#050507" />
    </linearGradient>

    <!-- Red Neon Gradient for Name -->
    <linearGradient id="neon-text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff4458" />
      <stop offset="30%" stop-color="#ff1a35" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#ff2a45" />
      <stop offset="100%" stop-color="#ff596f" />
      <animate attributeName="x1" from="-100%" to="100%" dur="8s" repeatCount="indefinite" />
      <animate attributeName="x2" from="0%" to="200%" dur="8s" repeatCount="indefinite" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7f1d1d" />
      <stop offset="25%" stop-color="#ef4444" />
      <stop offset="50%" stop-color="#ff4d6d" />
      <stop offset="75%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#7f1d1d" />
    </linearGradient>

    <!-- Scanline Gradient -->
    <linearGradient id="scanline" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="transparent" />
      <stop offset="50%" stop-color="#ef4444" stop-opacity="0.12" />
      <stop offset="100%" stop-color="transparent" />
      <animate attributeName="y1" from="-100%" to="100%" dur="4s" repeatCount="indefinite" />
      <animate attributeName="y2" from="0%" to="200%" dur="4s" repeatCount="indefinite" />
    </linearGradient>

    <!-- Filters for Glow -->
    <filter id="glow-heavy" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="ambient-blur">
      <feGaussianBlur stdDeviation="45" />
    </filter>

    <!-- High-Tech Grid Pattern -->
    <pattern id="cyber-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#ef4444" stroke-width="0.8" stroke-opacity="0.08" />
      <circle cx="0" cy="0" r="1.2" fill="#ef4444" fill-opacity="0.25" />
    </pattern>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 900;
      font-size: 48px;
      letter-spacing: 5px;
      text-transform: uppercase;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 600;
      font-size: 14.5px;
      letter-spacing: 3px;
      text-transform: uppercase;
      fill: #e2e8f0;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 700;
      font-size: 11px;
      letter-spacing: 1.8px;
      text-transform: uppercase;
      fill: #ff4d6d;
    }
    .pill-tag {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1.2px;
      fill: #94a3b8;
    }
    .pulse-dot {
      animation: pulse-glow 2s infinite ease-in-out;
    }
    @keyframes pulse-glow {
      0% { opacity: 0.4; r: 4px; }
      50% { opacity: 1; r: 6.5px; filter: drop-shadow(0 0 6px #ef4444); }
      100% { opacity: 0.4; r: 4px; }
    }
  </style>

  <!-- Background Base -->
  <rect width="960" height="250" rx="16" fill="url(#bg-grad)" />

  <!-- Ambient Red/Crimson Energy Glows -->
  <circle cx="160" cy="80" r="110" fill="#dc2626" opacity="0.22" filter="url(#ambient-blur)" />
  <circle cx="800" cy="140" r="130" fill="#ff1a35" opacity="0.16" filter="url(#ambient-blur)" />
  <circle cx="480" cy="180" r="90" fill="#7f1d1d" opacity="0.18" filter="url(#ambient-blur)" />

  <!-- Cyber Grid -->
  <rect width="960" height="250" rx="16" fill="url(#cyber-grid)" />

  <!-- Scanning Laser Line -->
  <rect width="960" height="250" rx="16" fill="url(#scanline)" />

  <!-- Glowing Border Outline -->
  <rect x="1.5" y="1.5" width="957" height="247" rx="15" fill="none" stroke="url(#border-grad)" stroke-width="1.8" stroke-opacity="0.7" />

  <!-- Corner Cybernetic Tech Brackets -->
  <!-- Top Left -->
  <path d="M 14 36 L 14 16 L 36 16" stroke="#ff2a45" stroke-width="3" fill="none" stroke-linecap="round" />
  <circle cx="14" cy="16" r="2" fill="#ffffff" />
  <!-- Top Right -->
  <path d="M 946 36 L 946 16 L 924 16" stroke="#ff2a45" stroke-width="3" fill="none" stroke-linecap="round" />
  <circle cx="946" cy="16" r="2" fill="#ffffff" />
  <!-- Bottom Left -->
  <path d="M 14 214 L 14 234 L 36 234" stroke="#ff2a45" stroke-width="3" fill="none" stroke-linecap="round" />
  <circle cx="14" cy="234" r="2" fill="#ffffff" />
  <!-- Bottom Right -->
  <path d="M 946 214 L 946 234 L 924 234" stroke="#ff2a45" stroke-width="3" fill="none" stroke-linecap="round" />
  <circle cx="946" cy="234" r="2" fill="#ffffff" />

  <!-- Status Pill at Top Center -->
  <g transform="translate(345, 22)">
    <rect width="270" height="26" rx="13" fill="#140608" stroke="#ff2a45" stroke-width="1.2" stroke-opacity="0.8" />
    <circle cx="18" cy="13" r="5" fill="#ef4444" class="pulse-dot" />
    <text x="145" y="17.5" text-anchor="middle" class="badge-text">BUILDING HIGH-IMPACT TECH</text>
  </g>

  <!-- Main Name Header -->
  <text x="480" y="106" text-anchor="middle" class="title-text" fill="url(#neon-text-grad)" filter="url(#glow-heavy)">
    AMITABHA GHORAI
  </text>
  <text x="480" y="106" text-anchor="middle" class="title-text" fill="#ffffff" fill-opacity="0.96">
    AMITABHA GHORAI
  </text>

  <!-- Subtitle Tagline -->
  <text x="480" y="145" text-anchor="middle" class="subtitle-text">
    <tspan fill="#ff4d6d">COMPUTER SCIENCE ENGINEER</tspan>
    <tspan fill="#64748b"> &#8226; </tspan>
    <tspan fill="#f8fafc">FULL STACK DEVELOPER</tspan>
    <tspan fill="#64748b"> &#8226; </tspan>
    <tspan fill="#ff4d6d">AI &amp; SOFTWARE BUILDER</tspan>
  </text>

  <!-- Sleek Glowing Red Center Divider with Diamond -->
  <g transform="translate(0, 166)">
    <line x1="220" y1="0" x2="450" y2="0" stroke="url(#border-grad)" stroke-width="1.5" stroke-opacity="0.85" />
    <polygon points="480,-6 486,0 480,6 474,0" fill="#ef4444" filter="url(#glow-heavy)" />
    <circle cx="480" cy="0" r="2" fill="#ffffff" />
    <line x1="510" y1="0" x2="740" y2="0" stroke="url(#border-grad)" stroke-width="1.5" stroke-opacity="0.85" />
  </g>

  <!-- Bottom Metadata Chips -->
  <g transform="translate(480, 204)">
    <text text-anchor="middle" class="pill-tag">
      <tspan fill="#ef4444">[STACK]</tspan> REACT &bull; FASTAPI &bull; PYTHON &bull; NODE.JS &bull; OPENCV &nbsp;&nbsp;&bull;&nbsp;&nbsp;
      <tspan fill="#ef4444">[COLLEGE]</tspan> TECHNO INDIA UNIVERSITY &nbsp;&nbsp;&bull;&nbsp;&nbsp;
      <tspan fill="#ef4444">[BASE]</tspan> KOLKATA, INDIA
    </text>
  </g>

  <!-- Secondary Footer Tag -->
  <g transform="translate(480, 228)">
    <text text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="600" fill="#64748b" letter-spacing="1.5">
      <tspan fill="#ef4444">&lt;/&gt;</tspan> TURNING COMPLEX IDEAS INTO SCALABLE PRODUCTION SYSTEMS
    </text>
  </g>
</svg>
